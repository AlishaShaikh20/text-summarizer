<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FFF7ED;
            color: #333;
        }
        .container{
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1{
            text-align: center;
            color: #FB923C;
        }

        #summarization-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            font-family: Arial, sans-serif;
        }

        button {
            background-color: #FB923C;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover{
            background-color: #EA580C;
        }

        .summary-output {
            margin-top: 20px;
            background: #FFEDD5;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        #summary-heading{
            margin-top: 0px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <h3 style="text-align: center; color: #666;">Using HuggingFace Transformer</h3>
        <p>Write or paste your content below for quick summarization.</p>

        <form id="summarization-form">
            <textarea id="dialogue-input" placeholder="Enter your content here..."></textarea>
            <button type="submit">Summarize</button>
        </form>

        <div class="summary-output">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary-text">Your summary will appear here...</p>
        </div>
    </div>

    <script>
        // PASTE YOUR ACTUAL MODAL DEPLOYMENT URL HERE
        const MODAL_URL = "/summarize";

        document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            // get reference to elements 
            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary-text");
            const submitButton = e.target.querySelector("button");

            const dialogue = dialogueInput.value.trim();
            if(!dialogue) return;

            // show processing message and disable button
            summaryText.innerText = "Processing... (This may take 15-30s on CPU)";
            submitButton.disabled = true;

            try {
                // send dialogue to Modal backend
                const response = await fetch(MODAL_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ text: dialogue }), // Matches FastAPI 'text' field
                });
                
                if(!response.ok){
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";
                
            } catch(err) {
                // show any error messages
                summaryText.innerText = `Error: ${err.message}`;
            } finally {
                // Re-enable the button
                submitButton.disabled = false;
            }
        });  
    </script>
</body>
</html>
